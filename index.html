<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Аида</title><style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500;700&display=swap');*{box-sizing:border-box}html{scroll-behavior:smooth;background:#09070d}body{margin:0;background:#09070d;color:#fff;font-family:Manrope,Arial,sans-serif;overflow-x:hidden}.bg{position:fixed;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.1s ease,transform 6s ease;transform:scale(1.08);filter:saturate(1.04) contrast(1.03)}.bg.on{opacity:1;transform:scale(1)}.bg:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.06),rgba(0,0,0,.64)),linear-gradient(180deg,rgba(0,0,0,.24),rgba(0,0,0,.62))}.slide{min-height:100svh;display:grid;place-items:center;padding:24px;position:relative;z-index:2}.card{width:min(760px,92vw);padding:clamp(30px,5vw,56px);text-align:center;border-radius:34px;background:rgba(8,6,12,.38);border:1px solid rgba(255,255,255,.20);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 95px rgba(0,0,0,.48);opacity:.12;transform:translateY(26px) scale(.98);transition:.85s ease}.card.on{opacity:1;transform:translateY(0) scale(1)}.sub{text-transform:uppercase;letter-spacing:.35em;color:#e7cf9a;font-size:12px;font-weight:700;margin-bottom:14px}h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(44px,8vw,94px);line-height:.93;margin:0 0 22px;text-shadow:0 12px 50px rgba(0,0,0,.55)}.line{height:1px;width:110px;margin:0 auto 24px;background:linear-gradient(90deg,transparent,#e7cf9a,transparent)}p{font-size:clamp(16px,2vw,20px);line-height:1.72;color:rgba(255,255,255,.9);margin:0 auto;max-width:590px}.secret{margin-top:22px;font-size:clamp(15px,1.8vw,18px);color:#ffe6e8;font-style:italic}.btn{margin-top:28px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:13px 24px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;letter-spacing:.13em;text-transform:uppercase;font-size:12px}.bar{position:fixed;left:0;bottom:0;height:3px;background:linear-gradient(90deg,#e8b4b8,#e7cf9a);z-index:8;transition:.3s}.music{position:fixed;right:18px;bottom:18px;z-index:20;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.38);backdrop-filter:blur(14px);color:white;border-radius:50%;width:58px;height:58px;font-size:25px;cursor:pointer;box-shadow:0 18px 55px rgba(0,0,0,.42)}.music.playing{color:#e7cf9a;box-shadow:0 0 0 9px rgba(231,207,154,.10),0 18px 55px rgba(0,0,0,.42)}.hint{position:fixed;right:84px;bottom:32px;z-index:19;display:flex;align-items:center;gap:10px;color:#fff;background:rgba(8,6,12,.48);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);padding:10px 14px;border-radius:999px;font-size:13px;box-shadow:0 16px 45px rgba(0,0,0,.35);animation:hint 1.8s ease-in-out infinite}.hint span{font-size:24px;color:#e7cf9a}.hint.hide{display:none}@keyframes hint{50%{transform:translateX(7px)}}@media(max-width:700px){.slide{place-items:end center;padding:22px 16px 78px}.card{padding:30px 22px;border-radius:28px;background:rgba(8,6,12,.44)}h1{font-size:clamp(40px,14vw,60px)}p{font-size:15.5px;line-height:1.68}.hint{right:78px;bottom:29px;font-size:11px;padding:8px 11px}.music{width:54px;height:54px}}</style></head><body><audio id="song" src="music/song.mp3" loop preload="none"></audio><div class="hint" id="hint">нажми, чтобы включить музыку <span>→</span></div><button class="music" id="music">♪</button><div id="bgs"></div><div class="bar" id="bar"></div><main id="main"></main><script>const slides=[['photos/photo1.jpg?v=hq3','Аида','Это история о нас','О моментах, которые хочется сохранить. О чувствах, которые сложно объяснить словами.'],['photos/photo2.jpg?v=hq3','Ты появилась — и всё стало теплее','очень важный момент','С тобой рядом мне спокойно, тепло и по-настоящему хорошо.'],['photos/photo3.jpg?v=hq3','Моменты, которые остаются внутри','наши воспоминания','Такие моменты хочется вспоминать снова и снова.'],['photos/photo4.jpg?v=hq3','С тобой по-другому','даже тишина особенная','С тобой даже простые прогулки становятся чем-то особенным.','Скажу тебе по секрету... Я очень люблю когда ты говоришь фразу «Мне нравится» на все что я тебе предложу.'],['photos/photo5.jpg?v=hq3','История которая ждет нас впереди...','Питер',''],['photos/photo6.jpg?v=hq3','Это только начало','самое красивое впереди','Самое красивое у нас ещё впереди. И я хочу пройти это вместе с тобой.']];const bgs=document.getElementById('bgs'),main=document.getElementById('main');slides.forEach((s,i)=>{let b=document.createElement('div');b.className='bg';b.style.backgroundImage=`url(${s[0]})`;bgs.appendChild(b);let sec=document.createElement('section');sec.className='slide';sec.id='s'+i;sec.innerHTML=`<div class="card"><div class="sub">${s[2]}</div><h1>${s[1]}</h1><div class="line"></div>${s[3]?`<p>${s[3]}</p>`:''}${s[4]?`<p class="secret">${s[4]}</p>`:''}${i==0?'<button class="btn" onclick="go(1)">Начать ↓</button>':''}${i==slides.length-1?'<button class="btn" onclick="go(0)">Вернуться ↑</button>':''}</div>`;main.appendChild(sec)});const bg=[...document.querySelectorAll('.bg')],cards=[...document.querySelectorAll('.card')];function go(n){document.getElementById('s'+n).scrollIntoView({behavior:'smooth'})}function upd(){let max=document.documentElement.scrollHeight-innerHeight,p=max>0?scrollY/max:0,n=Math.max(0,Math.min(slides.length-1,Math.round(p*(slides.length-1))));bg.forEach((e,i)=>e.classList.toggle('on',i==n));cards.forEach((e,i)=>e.classList.toggle('on',i==n));bar.style.width=((n+1)/slides.length*100)+'%'}addEventListener('scroll',upd,{passive:true});upd();let ctx,timer;function synth(){if(ctx)return;ctx=new(AudioContext||webkitAudioContext)();let notes=[392,440,523,587,523,440,392,330],i=0;timer=setInterval(()=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.055,ctx.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.75);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.8)},650)}document.getElementById('music').onclick=async()=>{let a=document.getElementById('song'),m=document.getElementById('music'),h=document.getElementById('hint');try{await a.play();}catch(e){synth()}m.classList.add('playing');h.classList.add('hide')};</script></body></html>
