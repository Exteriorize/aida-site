<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#0c0a0f"/><title>Аида — новая fullscreen-история</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html{scroll-behavior:smooth;background:#0c0a0f}body{margin:0;background:#0c0a0f;color:#fdf9f5;font-family:Manrope,system-ui,sans-serif;overflow-x:hidden}.loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(232,180,184,.18),transparent 45%),#0c0a0f;animation:loader-out .45s ease 1.05s forwards}.loader div{font-family:'Cormorant Garamond',serif;font-size:76px;color:#e8b4b8;animation:pulse 1.1s ease infinite}.loader p{position:absolute;top:56%;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:rgba(253,249,245,.68)}.backgrounds{position:fixed;inset:0;z-index:0;background:#0c0a0f;overflow:hidden}.bg{position:absolute;inset:0;background-position:center;background-size:cover;opacity:0;transform:scale(1.07);transition:opacity 1.15s ease,transform 6s ease}.bg.active{opacity:1;transform:scale(1)}.bg:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 0,rgba(0,0,0,.08) 35%,rgba(0,0,0,.48) 100%)}.slide{position:relative;z-index:2;min-height:100svh;display:grid;place-items:center;padding:clamp(20px,5vw,64px)}.text-card{width:min(720px,calc(100vw - 34px));padding:clamp(28px,5vw,58px);border-radius:34px;text-align:center;background:rgba(10,8,14,.36);border:1px solid rgba(255,255,255,.18);box-shadow:0 30px 90px rgba(0,0,0,.4);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:.15;transform:translateY(24px) scale(.97);transition:opacity .85s ease,transform .85s ease}.text-card.active{opacity:1;transform:translateY(0) scale(1)}.eyebrow{margin:0 0 18px;text-transform:uppercase;letter-spacing:.36em;font-size:clamp(10px,1.6vw,13px);font-weight:700;color:#e7cf9a}.text-card h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(46px,8vw,92px);font-weight:500;line-height:.92;text-shadow:0 10px 50px rgba(0,0,0,.36)}.line{height:1px;width:96px;margin:26px auto;background:linear-gradient(90deg,transparent,#c9a24b,transparent)}.copy{max-width:540px;margin:0 auto;font-size:clamp(16px,2vw,20px);line-height:1.85;color:rgba(253,249,245,.88)}.cta{margin-top:34px;border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:14px 26px;background:rgba(255,255,255,.12);color:#fff;letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:700;cursor:pointer;transition:.25s}.cta:hover{transform:translateY(-3px);background:rgba(255,255,255,.2);border-color:rgba(231,207,154,.7)}.music{position:fixed;right:20px;bottom:20px;z-index:50;width:58px;height:58px;border:1px solid rgba(255,255,255,.22);border-radius:50%;background:rgba(10,8,14,.38);backdrop-filter:blur(14px);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 18px 55px rgba(0,0,0,.35)}.music.is-playing{color:#e7cf9a;box-shadow:0 0 0 8px rgba(231,207,154,.08),0 18px 55px rgba(0,0,0,.35)}.progress{position:fixed;left:0;bottom:0;z-index:40;width:100%;height:3px;background:rgba(255,255,255,.12)}.progress span{display:block;height:100%;background:linear-gradient(90deg,#e8b4b8,#c9a24b);transition:width .35s ease}.dots{position:fixed;right:28px;top:50%;z-index:40;display:flex;flex-direction:column;gap:13px;transform:translateY(-50%)}.dots button{width:12px;height:12px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.34);cursor:pointer;transition:.25s}.dots button.active{background:#e7cf9a;box-shadow:0 0 18px rgba(231,207,154,.85);transform:scale(1.35)}@keyframes pulse{50%{transform:scale(1.14)}}@keyframes loader-out{to{opacity:0;visibility:hidden}}@media(max-width:720px){.slide{place-items:end center;padding:22px 16px 76px}.text-card{border-radius:28px;padding:28px 22px;background:rgba(10,8,14,.44)}.text-card h1{font-size:clamp(42px,14vw,62px)}.copy{font-size:15.5px;line-height:1.72}.dots{display:none}.music{width:52px;height:52px;right:15px;bottom:18px}}@media(min-width:1100px){.slide:nth-child(even) .text-card{margin-left:24vw}.slide:nth-child(odd) .text-card{margin-right:24vw}.slide:first-of-type .text-card,.slide:last-of-type .text-card{margin-left:0;margin-right:0}}</style></head><body><div class="loader"><div>♡</div><p>Загружаю новую fullscreen-историю…</p></div><audio id="music" src="music/song.mp3" loop preload="none"></audio><button class="music" id="musicBtn">♪</button><div class="progress"><span id="bar"></span></div><div class="backgrounds" id="backgrounds"></div><div class="dots" id="dots"></div><main id="slides"></main><script>const slides=[{image:'photos/photo1.jpg',title:'Аида',subtitle:'Это история о нас',text:'О моментах, которые хочется сохранить. О чувствах, которые сложно объяснить словами. О будущем, которое я хочу разделить с тобой.',fallback:'linear-gradient(135deg,#151226,#6b3f50 60%,#caa07e)'},{image:'photos/photo2.jpg',title:'Ты появилась — и всё стало теплее',subtitle:'очень важный момент',text:'Иногда человек становится важным не сразу словами, а ощущением. С тобой рядом мне спокойно, тепло и по-настоящему хорошо.',fallback:'linear-gradient(135deg,#2a2030,#cf8f7e 55%,#f0c9a8)'},{image:'photos/photo3.jpg',title:'Моменты, которые остаются внутри',subtitle:'наши воспоминания',text:'Есть дни, которые вроде бы обычные, но потом понимаешь: именно такие моменты хочется вспоминать снова и снова.',fallback:'linear-gradient(135deg,#221b29,#b58497 55%,#e9c3c9)'},{image:'photos/photo4.jpg',title:'С тобой по-другому',subtitle:'даже тишина особенная',text:'С тобой даже простые разговоры, прогулки и тишина становятся чем-то особенным.',fallback:'linear-gradient(135deg,#15131f,#27243e 55%,#3c3550)'},{image:'photos/photo5.jpg',title:'Я хочу, чтобы ты знала',subtitle:'самое главное',text:'Ты — мой самый любимый человек. Я очень дорожу тобой, твоим теплом, твоей улыбкой и тем, что между нами есть.',fallback:'linear-gradient(135deg,#1d1722,#8a5566 55%,#d99aa6)'},{image:'photos/photo6.jpg',title:'Наш будущий Питер',subtitle:'дождь, мосты, кофе и мы',text:'Я представляю, как однажды мы будем гулять по мокрым улицам Петербурга, пить кофе у окна, смотреть на огни города и понимать, что это уже не просто мечта.',fallback:'linear-gradient(135deg,#0d1424,#1d3b53 55%,#7a5c70)'},{image:'photos/photo7.jpg',title:'Наша новая глава',subtitle:'переезд и дом',text:'Переезд в Питер для меня — это не просто смена города. Это мечта о месте, где будет наша жизнь, наши вечера, наши планы и наш дом.',fallback:'linear-gradient(135deg,#17121b,#5b4b47 55%,#e7cf9a)'},{image:'photos/photo8.jpg',title:'Это только начало',subtitle:'самое красивое впереди',text:'Самое красивое у нас ещё впереди. И я хочу пройти это вместе с тобой.',fallback:'linear-gradient(135deg,#120f18,#6a4358 55%,#f7d9d9)'}];const bg=document.getElementById('backgrounds'),main=document.getElementById('slides'),dots=document.getElementById('dots');slides.forEach((s,i)=>{const b=document.createElement('div');b.className='bg';b.style.backgroundImage=`linear-gradient(180deg,rgba(5,4,8,.48),rgba(5,4,8,.70)),url(${s.image}),${s.fallback}`;bg.appendChild(b);const sec=document.createElement('section');sec.className='slide';sec.id='slide-'+i;sec.innerHTML=`<div class="text-card"><p class="eyebrow">${s.subtitle||''}</p><h1>${s.title}</h1><div class="line"></div><p class="copy">${s.text}</p>${i===0?'<button class="cta" onclick="goTo(1)">Начать ↓</button>':''}${i===slides.length-1?'<button class="cta" onclick="goTo(0)">Вернуться в начало ↑</button>':''}</div>`;main.appendChild(sec);const d=document.createElement('button');d.onclick=()=>goTo(i);dots.appendChild(d)});function goTo(i){document.getElementById('slide-'+i)?.scrollIntoView({behavior:'smooth'})}const bgs=[...document.querySelectorAll('.bg')],cards=[...document.querySelectorAll('.text-card')],dotBtns=[...document.querySelectorAll('.dots button')],bar=document.getElementById('bar');function onScroll(){const max=document.documentElement.scrollHeight-innerHeight;const p=max>0?scrollY/max:0;const a=Math.max(0,Math.min(slides.length-1,Math.round(p*(slides.length-1))));bgs.forEach((el,i)=>el.classList.toggle('active',i===a));cards.forEach((el,i)=>el.classList.toggle('active',i===a));dotBtns.forEach((el,i)=>el.classList.toggle('active',i===a));bar.style.width=((a+1)/slides.length*100)+'%'}addEventListener('scroll',onScroll,{passive:true});onScroll();document.getElementById('musicBtn').onclick=async()=>{const a=document.getElementById('music'),btn=document.getElementById('musicBtn');if(a.paused){await a.play().catch(()=>{});btn.classList.toggle('is-playing',!a.paused)}else{a.pause();btn.classList.remove('is-playing')}}</script></body></html>
